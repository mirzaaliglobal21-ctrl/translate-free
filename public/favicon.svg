<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient: Emerald to Deep Teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22887a" />
      <stop offset="45%" stop-color="#145d52" />
      <stop offset="100%" stop-color="#09352e" />
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1a8" />
      <stop offset="50%" stop-color="#ffe07a" />
      <stop offset="100%" stop-color="#df9a24" />
    </linearGradient>

    <!-- Golden Emblem Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff2ad" />
      <stop offset="70%" stop-color="#ffe07a" />
      <stop offset="100%" stop-color="#f5af31" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Rim -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#goldRim)" />
  <rect x="7" y="7" width="114" height="114" rx="27" fill="url(#bgGrad)" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="11" y="11" width="106" height="106" rx="23" fill="none" stroke="rgba(255, 224, 122, 0.25)" stroke-width="1.5" />

  <!-- Glowing Radial Accent Center -->
  <circle cx="64" cy="64" r="38" fill="rgba(62, 189, 169, 0.15)" />

  <!-- Left: Stylized Latin 'U' for Urdu/Universal -->
  <path d="M 33 42 L 33 66 C 33 77 41 84 52 84 C 55 84 58 83 60 81.5 L 60 74 C 58 75.5 55 76 52 76 C 45 76 41 71.5 41 64 L 41 42 Z" fill="url(#goldText)" filter="url(#glow)" />

  <!-- Center: Neural Translation Sparkle / Diamond Star -->
  <g transform="translate(64, 46)" filter="url(#glow)">
    <polygon points="0,-9 2.5,-2.5 9,0 2.5,2.5 0,9 -2.5,2.5 -9,0 -2.5,-2.5" fill="#ffffff" />
    <circle cx="0" cy="0" r="1.5" fill="#ffe07a" />
  </g>

  <!-- Right: Elegant Urdu Nastaliq 'ا / ء' Calligraphic Stroke Motif -->
  <!-- Main cascading stroke -->
  <path d="M 83 38 C 86 42 88 47 88 53 C 88 64 82 72 74 77 L 70 73 C 77 69 81 62 81 54 C 81 48 79 44 76 40 Z" fill="url(#goldText)" filter="url(#glow)" />
  
  <!-- Nuqta / Calligraphic Diamond Accent -->
  <g transform="translate(86, 75) rotate(45)" filter="url(#glow)">
    <rect x="-3.5" y="-3.5" width="7" height="7" rx="1.5" fill="url(#goldText)" />
  </g>

  <!-- Small Bidirectional Nano Arrows at bottom -->
  <g transform="translate(64, 98)" opacity="0.9">
    <!-- Left arrow -->
    <path d="M -16 0 L -8 0 M -12 -3 L -16 0 L -12 3" stroke="#ffe07a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right arrow -->
    <path d="M 8 0 L 16 0 M 12 -3 L 16 0 L 12 3" stroke="#ffe07a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
  </g>
</svg>
